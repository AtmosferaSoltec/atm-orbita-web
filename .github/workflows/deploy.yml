name: Deploy

on:
  push:
    branches: [production]
  # Lets you rerun a deploy (or go back to an older one) without pushing a commit.
  workflow_dispatch:

concurrency:
  group: deploy-orbita-web
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/atmosferasoltec/atm-orbita-web

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Project rule: develop -> main -> production. A commit that did not go
      # through main is not deployed.
      - name: Ensure the commit is already in main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::El commit $GITHUB_SHA no esta en main. Flujo obligatorio: develop -> main -> production."
            exit 1
          fi

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm check
      - run: pnpm exec vitest run --project server
      - run: pnpm build

  build-and-push:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # No build-args: the web has no configuration, the same image runs anywhere.
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=orbita-web
          cache-to: type=gha,scope=orbita-web,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: deploy/docker-compose.yml
          sparse-checkout-cone-mode: false

      # One SSH connection (ControlMaster) to copy the compose file and deploy, with
      # retries when opening it: if sshd or fail2ban cut a stray handshake
      # (`ssh: handshake failed: EOF`), the deploy does not fail because of it.
      - name: Copy compose file and deploy on server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          IMAGE_TAG: sha-${{ github.sha }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          opts=(-i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20
            -o ServerAliveInterval=15 -o ControlMaster=auto -o ControlPath=~/.ssh/cm-%C -o ControlPersist=120)
          target="$SSH_USER@$SSH_HOST"

          for attempt in 1 2 3 4 5; do
            if ssh "${opts[@]}" "$target" true; then break; fi
            if [ "$attempt" = 5 ]; then echo "::error::No se pudo abrir la conexion SSH tras 5 intentos"; exit 1; fi
            echo "SSH fallo (intento $attempt); reintento en $((attempt * 10)) s"
            sleep $((attempt * 10))
          done

          scp "${opts[@]}" deploy/docker-compose.yml "$target:/opt/orbita-web/docker-compose.yml"

          # The GHCR login lives on the server (~/.docker/config.json). If the pull
          # says `denied`, renew it with `docker login ghcr.io` on the VPS.
          ssh "${opts[@]}" "$target" "IMAGE_TAG=$IMAGE_TAG bash -s" <<'REMOTE'
          set -e
          cd /opt/orbita-web

          export IMAGE_TAG
          docker compose pull
          docker compose up -d
          docker image prune -f

          for _ in $(seq 1 60); do
            status="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' orbita-web 2>/dev/null || echo missing)"
            if [ "$status" = "healthy" ]; then
              echo "orbita-web esta healthy (${IMAGE_TAG})."
              exit 0
            fi
            sleep 2
          done

          echo "::error::orbita-web no quedo healthy en 120s (estado: ${status}). Ultimos logs:"
          docker compose logs --tail 50 app
          exit 1
          REMOTE
