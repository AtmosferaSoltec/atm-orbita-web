# nginx of the web container. The host nginx (TLS, the domain) proxies here.
# Everything is served from one origin, so the session cookie is first-party and
# the API needs no CORS.

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The largest upload is a 5 MB PDF; the API enforces its own limits.
    client_max_body_size 10m;

    # The API is reached by container name inside `atm-network`. Resolving it per
    # request (variable + resolver) keeps nginx starting even if the API is down.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    location /api/ {
        set $api http://orbita-api:3001;
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 30s;
        include /etc/nginx/security-headers.inc;
    }

    # Files with a hash in their name never change.
    location /_app/immutable/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/security-headers.inc;
        try_files $uri =404;
    }

    # Every other route is the app (client-side routing); index.html is never cached
    # so a new deploy shows up on the next visit.
    location / {
        add_header Cache-Control "no-cache";
        include /etc/nginx/security-headers.inc;
        try_files $uri $uri/ /index.html;
    }
}
